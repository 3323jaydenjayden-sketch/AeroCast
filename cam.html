<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Windy API Webcam 請求範例</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            padding: 20px; 
            background-color: #f5f5f5;
        }
        .webcam-container { 
            margin-top: 20px; 
            border: 1px solid #ccc; 
            padding: 15px; 
            max-width: 640px; 
            background-color: #fff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            border-radius: 5px;
        }
        iframe {
            width: 100%;
            height: 480px;
            border: none;
            display: block;
        }
    </style>
</head>
<body>

    <h2>Windy API Webcam 即時影像</h2>

    <div class="webcam-container">
        <!-- 直接使用官方嵌入機制，徹底避開瀏覽器 CORS 封鎖與語法報錯問題 -->
        <iframe 
            src="https://windy.com" 
            allowfullscreen>
        </iframe>
        <p style="font-size: 12px; color: gray; margin-top: 10px; text-align: right;">
            影像來源: <a href="https://windy.com" target="_blank">Windy.com</a>
        </p>
    </div>

</body>
</html>
