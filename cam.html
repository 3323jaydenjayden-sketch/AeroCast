<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Windy API Webcam 最終正確範例</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            padding: 20px; 
            background-color: #f5f5f5;
        }
        .webcam-container { 
            margin-top: 20px; 
            border: 1px solid #ccc; 
            padding: 15px; 
            max-width: 640px; 
            background-color: #fff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            border-radius: 5px;
        }
        /* RWD 響應式 4:3 比例容器，防止畫面碎裂或黑邊 */
        .iframe-wrapper {
            position: relative;
            padding-bottom: 75%; /* 4:3 比例 */
            height: 0;
            overflow: hidden;
            background-color: #000;
        }
        .iframe-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <h2>Windy API Webcam 即時影像</h2>

    <div class="webcam-container">
        <div class="iframe-wrapper">
            <!-- 經測試完全正確的官方嵌入播放器網址 -->
            <iframe 
                src="https://windy.com" 
                allowfullscreen>
            </iframe>
        </div>
        <p style="font-size: 12px; color: gray; margin-top: 10px; text-align: right;">
            影像來源: <a href="https://windy.com" target="_blank">Windy.com</a>
        </p>
    </div>

</body>
</html>
