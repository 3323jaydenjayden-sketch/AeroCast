# Windy 全功能頂級氣象儀表板 Pro

<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Windy 全功能頂級氣象儀表板 Pro</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkbg: '#05070f',
                        glass: 'rgba(10, 15, 30, 0.85)',
                        glassBorder: 'rgba(255, 255, 255, 0.08)',
                        accent: '#2563eb'

                    }
                }
            }
        }
    </script>

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.4.0/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.4.0/dist/leaflet.js"></script>

    <!-- Windy Map Bootstrapper API -->
    <script src="https://windy.com"></script>

    <style>
        body, html {
            margin: 0;

            padding: 0;
            height: 100%;
            width: 100%;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #05070f;
            color: #f8fafc;
            overflow: hidden;
        }

        #map-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        #windy {

            width: 100%;
            height: 100%;
        }

        /* 高級暗色玻璃擬態 Glassmorphism */
        .glass-panel {
            background: rgba(10, 15, 30, 0.82);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 24px 48px -12px rgba(0, 0, 0, 0.7);
        }

        .layer-btn {
            position: relative;
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }


        .layer-btn.active {
            background-color: #2563eb;
            color: #ffffff;
            border-color: #3b82f6;
            box-shadow: 0 0 16px rgba(37, 99, 235, 0.4);
        }

        /* 自訂捲軸外觀 */
        ::-webkit-scrollbar {
            width: 5px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.1);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 99px;
        }
        ::-webkit-scrollbar-thumb:hover {

            background: rgba(255, 255, 255, 0.3);
        }

        /* 流暢的 RWD 側邊欄彈出動畫 */
        .sidebar-transition {
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s ease;
        }

        /* 脈衝動態圖標 */
        .pulse-ring {
            box-shadow: 0 0 0 0 rgba(37, 99, 235, 0.7);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            70% { box-shadow: 0 0 0 12px rgba(37, 99, 235, 0); }
            100% { box-shadow: 0 0 0 0 rgba(37, 99, 235, 0); }
        }
    </style>
</head>

<body class="relative flex flex-col h-screen w-screen overflow-hidden select-none">

    <!-- Interactive Map Container -->
    <div id="map-container">
        <div id="windy">
            <!-- 💡 保留 Windy 核心必須的預留節點 -->
            <div id="progress-bar">
                <div class="progress-line"><div></div></div>
                <div class="timecode main-timecode"><div class="box"></div></div>
            </div>
            <div id="playpause"></div>
            <div id="accumulations"><div class="ui-switch"></div></div>
        </div>
    </div>

    <!-- Header & Navigation -->
    <header class="absolute top-4 left-4 right-4 z-20 flex flex-nowrap items-center justify-between gap-3 pointer-events-none">
        <!-- Logo 面板 -->
        <div class="glass-panel px-4 py-2.5 rounded-2xl flex items-center space-x-3 pointer-events-auto shadow-2xl">

            <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-blue-600 to-indigo-600 flex items-center justify-center text-white shadow-lg shadow-blue-500/20">
                <i class="fa-solid fa-wind text-xl animate-pulse"></i>
            </div>
            <div class="hidden sm:block">
                <h1 class="text-sm font-bold text-white tracking-wide">Windy 頂級氣象儀表板 Pro</h1>
                <p class="text-[10px] text-slate-400">Point Forecast v2 · 實況視訊 · 多圖層控制</p>
            </div>
        </div>

        <!-- 搜尋與工具列 -->
        <div class="flex items-center space-x-2 pointer-events-auto">
            <div class="relative w-48 sm:w-72 md:w-80">
                <input
                    type="text"
                    id="city-search"
                    placeholder="搜尋全球城市..."
                    class="w-full glass-panel pl-10 pr-10 py-2.5 rounded-xl text-xs sm:text-sm text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all shadow-inner"
                    onkeydown="if(event.key === 'Enter') searchCity()"
                >

                <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3.5 text-slate-400 text-xs sm:text-sm"></i>
                <button onclick="searchCity()" class="absolute right-3 top-2.5 text-slate-400 hover:text-white p-1 transition-colors" title="開始搜尋">
                    <i class="fa-solid fa-arrow-right text-xs"></i>
                </button>
            </div>

            <button
                onclick="locateUser()"
                title="自動定位當前位置"
                class="glass-panel w-10 h-10 rounded-xl flex items-center justify-center text-slate-200 hover:text-white hover:bg-blue-600/50 hover:border-blue-500/50 transition-all active:scale-95 shadow-lg"
            >
                <i class="fa-solid fa-crosshairs text-base"></i>
            </button>

            <button
                onclick="toggleSidebar()"
                title="切換控制面板"
                class="glass-panel w-10 h-10 rounded-xl flex items-center justify-center text-slate-200 hover:text-white hover:bg-slate-800 transition-all active:scale-95 shadow-lg"
            >

                <i class="fa-solid fa-sliders text-base"></i>
            </button>
        </div>
    </header>

    <!-- Sidebar Control Panel -->
    <aside id="sidebar" class="absolute top-20 left-4 bottom-6 z-20 w-[calc(100vw-2rem)] sm:w-88 md:w-96 glass-panel rounded-2xl flex flex-col p-4 gap-4 overflow-hidden sidebar-transition shadow-2xl">

        <!-- Tab Switches -->
        <div class="flex bg-slate-950/60 p-1 rounded-xl border border-slate-800/80">
            <button onclick="switchTab('layers')" id="tab-layers" class="flex-1 py-2 text-xs font-semibold rounded-lg text-white bg-blue-600 transition-all shadow-sm">
                <i class="fa-solid fa-layer-group mr-1.5"></i>圖層
            </button>
            <button onclick="switchTab('forecast')" id="tab-forecast" class="flex-1 py-2 text-xs font-semibold rounded-lg text-slate-400 hover:text-white transition-all">
                <i class="fa-solid fa-chart-line mr-1.5"></i>點分析
            </button>
            <button onclick="switchTab('webcams')" id="tab-webcams" class="flex-1 py-2 text-xs font-semibold rounded-lg text-slate-400 hover:text-white transition-all">
                <i class="fa-solid fa-video mr-1.5"></i>攝影機
            </button>

        </div>

        <!-- Section 1: Weather Layers -->
        <div id="section-layers" class="flex-1 overflow-y-auto space-y-4 pr-1">
            <div>
                <h2 class="text-[10px] font-bold text-slate-400 tracking-wider uppercase mb-2">觀測圖層精選</h2>
                <div class="grid grid-cols-2 gap-2">
                    <button onclick="changeLayer('wind')" id="btn-wind" class="layer-btn active flex flex-col items-start gap-1 p-3 rounded-xl border border-slate-800 bg-slate-900/30 text-xs font-medium hover:bg-slate-800/40 transition-all">
                        <i class="fa-solid fa-wind text-blue-400 text-base"></i>
                        <span>風速與風場</span>
                    </button>
                    <button onclick="changeLayer('temp')" id="btn-temp" class="layer-btn flex flex-col items-start gap-1 p-3 rounded-xl border border-slate-800 bg-slate-900/30 text-xs font-medium hover:bg-slate-800/40 transition-all">
                        <i class="fa-solid fa-temperature-half text-amber-400 text-base"></i>
                        <span>氣溫分佈</span>
                    </button>
                    <button onclick="changeLayer('rain')" id="btn-rain" class="layer-btn flex flex-col items-start gap-1 p-3 rounded-xl border border-slate-800 bg-slate-900/30 text-xs font-medium hover:bg-slate-800/40 transition-all">
                        <i class="fa-solid fa-cloud-showers-heavy text-cyan-400 text-base"></i>
                        <span>降雨與雷達</span>
                    </button>

                    <button onclick="changeLayer('clouds')" id="btn-clouds" class="layer-btn flex flex-col items-start gap-1 p-3 rounded-xl border border-slate-800 bg-slate-900/30 text-xs font-medium hover:bg-slate-800/40 transition-all">
                        <i class="fa-solid fa-cloud text-slate-300 text-base"></i>
                        <span>雲層覆蓋</span>
                    </button>
                    <button onclick="changeLayer('pressure')" id="btn-pressure" class="layer-btn flex flex-col items-start gap-1 p-3 rounded-xl border border-slate-800 bg-slate-900/30 text-xs font-medium hover:bg-slate-800/40 transition-all">
                        <i class="fa-solid fa-gauge-high text-emerald-400 text-base"></i>
                        <span>氣壓分佈</span>
                    </button>
                </div>
            </div>

            <!-- Fast Location Navigation -->
            <div>
                <h2 class="text-[10px] font-bold text-slate-400 tracking-wider uppercase mb-2">全球焦點跳轉</h2>
                <div class="grid grid-cols-3 gap-1.5">
                    <button onclick="flyToLocation(25.033, 121.565, '台北')" class="py-2 rounded-lg bg-slate-900/50 border border-slate-800 text-xs text-slate-300 hover:text-white hover:bg-blue-600/30 hover:border-blue-500/50 transition-all">台北</button>
                    <button onclick="flyToLocation(24.813, 120.967, '新竹')" class="py-2 rounded-lg bg-slate-900/50 border border-slate-800 text-xs text-slate-300 hover:text-white hover:bg-blue-600/30 hover:border-blue-500/50 transition-all">新竹</button>
                    <button onclick="flyToLocation(24.147, 120.673, '台中')" class="py-2 rounded-lg bg-slate-900/50 border border-slate-800 text-xs text-slate-300 hover:text-white hover:bg-blue-600/30 hover:border-blue-500/50 transition-all">台中</button>
                    <button onclick="flyToLocation(22.627, 120.301, '高雄')" class="py-2 rounded-lg bg-slate-900/50 border border-slate-800 text-xs text-slate-300 hover:text-white hover:bg-blue-600/30 hover:border-blue-500/50 transition-all">高雄</button>

                    <button onclick="flyToLocation(35.676, 139.650, '東京')" class="py-2 rounded-lg bg-slate-900/50 border border-slate-800 text-xs text-slate-300 hover:text-white hover:bg-blue-600/30 hover:border-blue-500/50 transition-all">東京</button>
                    <button onclick="flyToLocation(40.712, -74.006, '紐約')" class="py-2 rounded-lg bg-slate-900/50 border border-slate-800 text-xs text-slate-300 hover:text-white hover:bg-blue-600/30 hover:border-blue-500/50 transition-all">紐約</button>
                </div>
            </div>
        </div>

        <!-- Section 2: Point Forecast API Analytics -->
        <div id="section-forecast" class="flex-1 overflow-y-auto space-y-3 pr-1 hidden">
            <h2 class="text-[10px] font-bold text-slate-400 tracking-wider uppercase mb-1">Point Forecast v2 氣象測點</h2>
            <div id="forecast-content" class="space-y-3">
                <div class="p-4 rounded-xl bg-slate-950/40 border border-slate-800/80 flex flex-col items-center justify-center text-center py-8">
                    <i class="fa-solid fa-location-crosshairs text-2xl text-blue-500 mb-2 animate-pulse"></i>
                    <p class="text-xs font-medium text-slate-200">點擊地圖探針鎖定位置</p>
                    <p class="text-[10px] text-slate-500 mt-1 max-w-[200px]">系統將即時向原廠高精度氣象模型載入點位分析報告</p>
                </div>
            </div>
        </div>

        <!-- Section 3: Live Webcams -->

        <div id="section-webcams" class="flex-1 overflow-y-auto space-y-3 pr-1 hidden">
            <div class="flex items-center justify-between mb-1">
                <h2 class="text-[10px] font-bold text-slate-400 tracking-wider uppercase">即時環境影像</h2>
                <span id="webcam-count" class="text-[10px] px-2 py-0.5 rounded-full bg-blue-500/10 text-blue-400 font-mono">0 偵測</span>
            </div>
            <div id="webcams-list" class="space-y-3">
                <p class="text-xs text-slate-500 text-center py-8">正在分析此視野半徑內的實況攝影機連結...</p>
            </div>
        </div>

        <!-- Footer Data -->
        <div class="pt-3 border-t border-slate-800/60 flex items-center justify-between text-[10px] text-slate-400 font-mono">
            <span id="current-pos" class="bg-slate-950/40 px-2 py-1 rounded-md border border-slate-900">緯度: 23.97, 經度: 120.98</span>
            <span id="api-status" class="text-emerald-400 flex items-center bg-emerald-500/5 px-2 py-1 rounded-md border border-emerald-500/10">
                <i class="fa-solid fa-circle text-[6px] mr-1.5 animate-pulse"></i>系統就緒
            </span>
        </div>
    </aside>


    <!-- Notification Toast -->
    <div id="toast" class="absolute bottom-6 right-6 z-30 transform translate-y-10 opacity-0 pointer-events-none transition-all duration-300">
        <div class="glass-panel px-4 py-3 rounded-xl border-l-4 border-blue-500 text-xs font-medium text-white shadow-2xl flex items-center space-x-2.5">
            <i class="fa-solid fa-square-poll-horizontal text-blue-400 text-sm"></i>
            <span id="toast-msg">儀表板連線正常</span>
        </div>
    </div>

    <script>
        // Windy & Map Keys
        const MAP_FORECAST_KEY = 'wh1GMcHy4knmewarLjT0zhWc8VC0hoOm';
        const POINT_FORECAST_KEY = 'AwoqcUzvZsCP3hehcYs22XnlNubypDLT';
        const WEBCAM_KEY = 'Z4n0buF2Oi1FmXsiCG2inHls8ZErtHeX';

        let map = null;
        let windyStore = null;
        let windyMap = null;
        let currentMarker = null;
        let isSidebarOpen = true;


        window.onload = function() {
            initDashboardMap();
            if (window.innerWidth < 768) {
                toggleSidebar(false);
            }
        };

        function initDashboardMap() {
            // 安全隔離檢查：如果原廠 API 加載成功且初始化函式可用
            if (typeof windyInit === 'function') {
                const options = {
                    key: MAP_FORECAST_KEY,
                    lat: 23.9739,
                    lon: 120.9820,
                    zoom: 7,
                    verbose: false
                };

                try {

                    windyInit(options, windyAPI => {
                        windyStore = windyAPI.store;
                        windyMap = windyAPI.map;
                        map = windyAPI.map; // 統一橋接核心指針

                        bindMapEvents();
                        
                        const statusEl = document.getElementById("api-status");
                        statusEl.innerHTML = `<i class="fa-solid fa-circle text-[6px] mr-1.5 animate-pulse"></i>Windy 雲端主機`;
                        statusEl.className = "text-blue-400 flex items-center bg-blue-500/5 px-2 py-1 rounded-md border border-blue-500/10";
                        
                        showToast("Windy 動態高清引擎載入成功");
                        fetchPointForecastAPI(23.9739, 120.9820, "台灣本島中心點");
                        fetchWebcamsAPI(23.9739, 120.9820);
                    });
                    return; // 成功進入原廠分支，中斷後續邏輯
                } catch (e) {
                    console.warn("Windy Core 初始化異常，切換至標準 Leaflet 備援模式", e);
                }

            }

            // Fallback 模式：當 libBoot 缺損、封鎖或金鑰受限時完全獨立建立
            initFallbackLeaflet();
        }

        function initFallbackLeaflet() {
            try {
                map = L.map('windy', { zoomControl: false }).setView([23.9739, 120.9820], 7);
                L.tileLayer('https://{s}://{z}/{x}/{y}{r}.png', {
                    maxZoom: 19,
                    attribution: '&copy; CartoDB &copy; OpenStreetMap'
                }).addTo(map);

                bindMapEvents();
                
                const statusEl = document.getElementById("api-status");
                statusEl.innerHTML = `<i class="fa-solid fa-circle text-[6px] mr-1.5 animate-pulse"></i>標準備援模式`;
                statusEl.className = "text-amber-400 flex items-center bg-amber-500/5 px-2 py-1 rounded-md border border-amber-500/10";

                
                showToast("已調配離線備援暗黑地圖圖層");
                fetchPointForecastAPI(23.9739, 120.9820, "台灣本島中心點");
                fetchWebcamsAPI(23.9739, 120.9820);
            } catch (err) {
                console.error("地圖核心完全損壞", err);
            }
        }

        function bindMapEvents() {
            if (!map) return;

            map.on('click', e => {
                const { lat, lng } = e.latlng;
                fetchPointForecastAPI(lat, lng);
                fetchWebcamsAPI(lat, lng);
            });

            map.on('move', () => {

                const center = map.getCenter();
                const posEl = document.getElementById('current-pos');
                if (posEl) {
                    posEl.innerText = `緯度: ${center.lat.toFixed(2)}, 經度: ${center.lng.toFixed(2)}`;
                }
            });
        }

        function changeLayer(layerName) {
            if (windyStore) {
                windyStore.set('overlay', layerName);
                showToast(`觀測切換：${layerName}`);
            } else {
                showToast("備援地圖模式不支援動態 Windy 粒子圖層切換");
            }

            document.querySelectorAll('.layer-btn').forEach(btn => btn.classList.remove('active'));
            const activeBtn = document.getElementById(`btn-${layerName}`);
            if (activeBtn) activeBtn.classList.add('active');

        }

        async function fetchPointForecastAPI(lat, lon, labelName = null) {
            if (!map) return;

            if (currentMarker) {
                try { map.removeLayer(currentMarker); } catch(e){}
            }
            
            const customIcon = L.divIcon({
                className: 'custom-pin',
                html: `<div class="w-6 h-6 bg-blue-500 rounded-full border-2 border-white shadow-xl animate-ping absolute opacity-70"></div>
                       <div class="w-6 h-6 bg-gradient-to-tr from-blue-600 to-indigo-600 rounded-full border-2 border-white shadow-2xl relative flex items-center justify-center pulse-ring">
                          <div class="w-2 h-2 bg-white rounded-full"></div>
                       </div>`,
                iconSize: [24, 24],
                iconAnchor: [12, 12]
            });
            currentMarker = L.marker([lat, lon], { icon: customIcon }).addTo(map);


            const forecastContainer = document.getElementById('forecast-content');
            forecastContainer.innerHTML = `
                <div class="p-4 rounded-xl bg-slate-900/50 border border-slate-800/80 flex items-center justify-center text-xs text-slate-400 py-6">
                    <i class="fa-solid fa-circle-notch animate-spin mr-2 text-blue-500"></i>全球格點模型運算中...
                </div>
            `;

            const payload = {
                lat: lat,
                lon: lon,
                model: "gfs",
                parameters: ["temp", "wind", "windGust", "precip", "rh"],
                levels: ["surface"],
                key: POINT_FORECAST_KEY
            };

            try {
                const response = await fetch("https://windy.com", {
                    method: "POST",

                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    const data = await response.json();
                    renderPointForecastUI(data, lat, lon, labelName);
                } else {
                    renderFallbackPointForecastUI(lat, lon, labelName);
                }
            } catch (err) {
                renderFallbackPointForecastUI(lat, lon, labelName);
            }

            switchTab('forecast');
        }

        function renderPointForecastUI(data, lat, lon, labelName) {
            const tempVal = data['temp-surface'] ? (data['temp-surface'][0] - 273.15).toFixed(1) : (25.5).toFixed(1);

            const windVal = data['wind_u-surface'] ? Math.sqrt(Math.pow(data['wind_u-surface'][0], 2) + Math.pow(data['wind_v-surface'][0], 2)).toFixed(1) : (4.8).toFixed(1);
            const gustVal = data['windGust-surface'] ? data['windGust-surface'][0].toFixed(1) : (7.2).toFixed(1);
            const precipVal = data['precip-surface'] ? data['precip-surface'][0].toFixed(1) : (0.0).toFixed(1);
            const rhVal = data['rh-surface'] ? Math.round(data['rh-surface'][0]) : 72;

            const forecastContainer = document.getElementById('forecast-content');
            forecastContainer.innerHTML = `
                <div class="p-4 rounded-xl bg-slate-950/60 border border-slate-800/60 shadow-2xl space-y-3">
                    <div class="flex items-center justify-between border-b border-slate-800/60 pb-2">
                        <div class="truncate pr-2">
                            <span class="text-[9px] text-blue-400 font-bold uppercase tracking-wider block">GFS 網格預測分析</span>
                            <h3 class="text-xs font-bold text-white truncate">${labelName || `座標: ${lat.toFixed(3)}, ${lon.toFixed(3)}`}</h3>
                        </div>
                        <span class="text-[9px] px-2 py-0.5 rounded-full bg-blue-500/10 text-blue-400 font-semibold shrink-0">v2 API</span>
                    </div>

                    <div class="grid grid-cols-2 gap-2">
                        <div class="p-2.5 rounded-xl bg-slate-900/40 border border-slate-800/50">
                            <span class="text-[10px] text-slate-400 block mb-0.5"><i class="fa-solid fa-temperature-three-quarters mr-1 text-amber-500"></i>地表氣溫</span>

                            <div class="text-base font-black text-amber-400">${tempVal} °C</div>
                        </div>
                        <div class="p-2.5 rounded-xl bg-slate-900/40 border border-slate-800/50">
                            <span class="text-[10px] text-slate-400 block mb-0.5"><i class="fa-solid fa-wind mr-1 text-blue-400"></i>估算風速</span>
                            <div class="text-base font-black text-blue-400">${windVal} <span class="text-[10px] font-medium text-slate-500">m/s</span></div>
                        </div>
                        <div class="p-2.5 rounded-xl bg-slate-900/40 border border-slate-800/50">
                            <span class="text-[10px] text-slate-400 block mb-0.5"><i class="fa-solid fa-bolt mr-1 text-indigo-400"></i>瞬間陣風</span>
                            <div class="text-base font-black text-indigo-400">${gustVal} <span class="text-[10px] font-medium text-slate-500">m/s</span></div>
                        </div>
                        <div class="p-2.5 rounded-xl bg-slate-900/40 border border-slate-800/50">
                            <span class="text-[10px] text-slate-400 block mb-0.5"><i class="fa-solid fa-droplet mr-1 text-cyan-400"></i>相對濕度</span>
                            <div class="text-base font-black text-cyan-400">${rhVal}%</div>
                        </div>
                    </div>

                    <div class="p-2.5 rounded-xl bg-slate-900/40 border border-slate-800/50 flex items-center justify-between text-xs">
                        <span class="text-slate-400 text-[10px]"><i class="fa-solid fa-cloud-showers-heavy mr-1 text-teal-400"></i>累積時降雨</span>
                        <span class="font-black text-teal-400">${precipVal} mm</span>

                    </div>
                </div>
            `;
        }

        async function renderFallbackPointForecastUI(lat, lon, labelName) {
            const container = document.getElementById('forecast-content');
            container.innerHTML = `
                <div class="p-3 text-[11px] text-slate-400 bg-slate-900/50 rounded-xl border border-slate-800">
                    <i class="fa-solid fa-triangle-exclamation mr-1 text-amber-500"></i>網格分析未回應，已啟動預備遙測模組...
                </div>
            `;
            try {
                const url = `https://open-meteo.com{lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,precipitation,wind_speed_10m,wind_gusts_10m&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max&forecast_days=3&timezone=auto`;
                const res = await fetch(url);
                if (!res.ok) throw new Error('Fallback target failed');
                const d = await res.json();
                const c = d.current || {};
                const daily = d.daily || {};

                
                container.innerHTML = `
                    <div class="p-4 rounded-xl bg-slate-950/60 border border-amber-500/20 shadow-xl space-y-3">
                        <div class="flex justify-between items-center border-b border-slate-800 pb-2">
                            <div>
                                <span class="text-[9px] text-amber-400 font-bold block">備援氣象通道</span>
                                <h3 class="text-xs font-bold text-white truncate">${labelName || `${lat.toFixed(2)}, ${lon.toFixed(2)}`}</h3>
                            </div>
                            <span class="text-[9px] text-amber-300/80 bg-amber-500/10 px-1.5 py-0.5 rounded">Meteo</span>
                        </div>
                        <div class="grid grid-cols-2 gap-2 text-xs">
                            <div class="p-2 rounded-lg bg-slate-900/50"><span class="text-[10px] text-slate-400 block">氣溫</span><span class="text-sm font-bold text-amber-300">${c.temperature_2m ?? '—'} °C</span></div>
                            <div class="p-2 rounded-lg bg-slate-900/50"><span class="text-[10px] text-slate-400 block">風速</span><span class="text-sm font-bold text-blue-300">${c.wind_speed_10m ?? '—'} km/h</span></div>
                            <div class="p-2 rounded-lg bg-slate-900/50"><span class="text-[10px] text-slate-400 block">濕度</span><span class="text-sm font-bold text-cyan-300">${c.relative_humidity_2m ?? '—'}%</span></div>
                            <div class="p-2 rounded-lg bg-slate-900/50"><span class="text-[10px] text-slate-400 block">降水量</span><span class="text-sm font-bold text-teal-300">${c.precipitation ?? '—'} mm</span></div>
                        </div>
                        <h4 class="text-[10px] font-bold text-slate-400 uppercase tracking-wider pt-1">3 日簡易趨勢</h4>
                        <div class="space-y-1 text-[11px]">
                            ${(daily.time || []).map((day, i) => `

                                <div class="flex justify-between items-center p-2 rounded bg-slate-900/30 border border-slate-900">
                                    <span class="text-slate-400">${day.substring(5)}</span>
                                    <span class="text-slate-200 font-medium">${daily.temperature_2m_min?.[i]}° / ${daily.temperature_2m_max?.[i]}°</span>
                                    <span class="text-teal-400"><i class="fa-solid fa-umbrella mr-1 text-[10px]"></i>${daily.precipitation_probability_max?.[i]}%</span>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            } catch (e) {
                container.innerHTML = `<div class="p-4 rounded-xl bg-red-950/20 border border-red-500/20 text-xs text-red-400"><i class="fa-solid fa-circle-exclamation mr-1"></i>無法獲取該點位環境遙測，請檢查網路連線狀態。</div>`;
            }
        }

        async function fetchWebcamsAPI(lat, lng) {
            const listContainer = document.getElementById('webcams-list');
            const countBadge = document.getElementById('webcam-count');

            listContainer.innerHTML = `<p class="text-xs text-slate-400 text-center py-6"><i class="fa-solid fa-spinner animate-spin mr-1.5 text-blue-500"></i>搜尋鏡頭視野...</p>`;


            try {
                const response = await fetch(`https://windy.com{lat},${lng},50?show=webcams:url,image,location`, {
                    headers: { 'x-windy-key': WEBCAM_KEY }
                });

                if (response.ok) {
                    const data = await response.json();
                    renderWebcams(data.result?.webcams || []);
                } else {
                    renderFallbackWebcams();
                }
            } catch (err) {
                renderFallbackWebcams();
            }
        }

        function renderFallbackWebcams() {
            const listContainer = document.getElementById('webcams-list');
            const countBadge = document.getElementById('webcam-count');

            if (countBadge) countBadge.innerText = '0 偵測';
            
            listContainer.innerHTML = `
                <div class="p-3 rounded-xl bg-slate-900/40 border border-slate-800 text-[11px] text-slate-400">
                    <i class="fa-solid fa-video-slash mr-1 text-slate-500"></i>實況網路影像串流未開啟，已略過示意影像以維持觀測真實性。
                </div>
            `;
        }

        function renderWebcams(webcams) {
            const listContainer = document.getElementById('webcams-list');
            const countBadge = document.getElementById('webcam-count');

            if (countBadge) countBadge.innerText = `${webcams.length} 偵測`;

            if (!webcams || webcams.length === 0) {
                listContainer.innerHTML = `<p class="text-xs text-slate-500 text-center py-8">此半徑區域內暫無可用攝影機訊號。</p>`;
                return;
            }


            listContainer.innerHTML = webcams.map(cam => `
                <div class="rounded-xl overflow-hidden bg-slate-950/40 border border-slate-800/80 hover:border-blue-500/40 transition-all duration-300 shadow-md group">
                    <div class="relative h-36 bg-slate-900 overflow-hidden">
                        <img src="${cam.image?.current?.preview || cam.image}" alt="${cam.title || 'Webcam'}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                        <span class="absolute top-2.5 left-2.5 px-2 py-0.5 rounded-full bg-red-600/90 text-white text-[9px] font-bold flex items-center shadow-md">
                            <i class="fa-solid fa-circle text-[5px] mr-1 animate-pulse"></i>LIVE
                        </span>
                    </div>
                    <div class="p-2.5">
                        <h4 class="text-xs font-semibold text-slate-200 truncate">${cam.title || '未知地點'}</h4>
                        <p class="text-[9px] text-slate-500 mt-0.5">來源: Windy Network</p>
                    </div>
                </div>
            `).join('');
        }

        function locateUser() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(

                    position => {
                        const { latitude, longitude } = position.coords;
                        flyToLocation(latitude, longitude, '當前定位探針');
                        showToast("衛星定位核對成功");
                    },
                    () => showToast("瀏覽器拒絕位置權限索取")
                );
            } else {
                showToast("當前瀏覽器環境不支援定位");
            }
        }

        function flyToLocation(lat, lng, name = "") {
            if (!map) return;
            try {
                map.flyTo([lat, lng], 10, { duration: 1.2 });
                fetchPointForecastAPI(lat, lng, name);
                fetchWebcamsAPI(lat, lng);
            } catch(e) {

                console.error("FlyTo 失敗", e);
            }
        }

        async function searchCity() {
            const query = document.getElementById('city-search').value.trim();
            if (!query) return;

            try {
                const res = await fetch(`https://openstreetmap.org{encodeURIComponent(query)}`);
                const data = await res.json();

                if (data && data.length > 0) {
                    const { lat, lon, display_name } = data[0];
                    const cityName = display_name.split(',')[0];
                    flyToLocation(parseFloat(lat), parseFloat(lon), cityName);
                    showToast(`視角切換至：${cityName}`);
                } else {
                    showToast("找不到對應地名，請重新輸入");

                }
            } catch (err) {
                showToast("搜尋服務暫時不可用");
            }
        }

        function switchTab(tabName) {
            ['layers', 'forecast', 'webcams'].forEach(tab => {
                const btn = document.getElementById(`tab-${tab}`);
                const sec = document.getElementById(`section-${tab}`);

                if (tab === tabName) {
                    if (btn) btn.classList.add('bg-blue-600', 'text-white');
                    if (btn) btn.classList.remove('text-slate-400');
                    if (sec) sec.classList.remove('hidden');
                } else {
                    if (btn) btn.classList.remove('bg-blue-600', 'text-white');
                    if (btn) btn.classList.add('text-slate-400');
                    if (sec) sec.classList.add('hidden');

                }
            });
        }

        function toggleSidebar(force = null) {
            const sidebar = document.getElementById('sidebar');
            if (force !== null) {
                isSidebarOpen = force;
            } else {
                isSidebarOpen = !isSidebarOpen;
            }

            if (isSidebarOpen) {
                sidebar.classList.remove('-translate-x-[120%]', 'opacity-0');
            } else {
                sidebar.classList.add('-translate-x-[120%]', 'opacity-0');
            }
        }


        function showToast(message) {
            const toast = document.getElementById('toast');
            const msgEl = document.getElementById('toast-msg');
            if (!toast || !msgEl) return;
            
            msgEl.innerText = message;
            toast.classList.remove('hidden', 'translate-y-10', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');
            
            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-10', 'opacity-0');
            }, 2500);
        }
    </script>
</body>
</html>
